name: booky
description: "BOOKY - Aplicativo de biblioteca pessoal e rastreamento de leitura."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  uuid: ^4.5.1
  path_provider: ^2.1.5
  http: ^1.2.2
  mobile_scanner: ^6.0.4
  google_mlkit_text_recognition: ^0.14.0
  image_picker: ^1.1.2
  fl_chart: ^0.70.2
  pdf: ^3.11.1
  csv: ^6.0.0
  share_plus: ^10.1.3
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
